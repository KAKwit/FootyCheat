name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: io.github.kakwit.FootyCheat-x86_64.flatpak
          manifest-path: io.github.kakwit.FootyCheat.yml
          artifact-name: io.github.kakwit.FootyCheat-x86_64.flatpak

  release:
    name: Publish
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: io.github.kakwit.FootyCheat-x86_64.flatpak
          path: dist

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/io.github.kakwit.FootyCheat-x86_64.flatpak
