id: io.github.kakwit.FootyCheat
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: footy-cheat
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
modules:
  - name: footy-cheat
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
    sources:
      - type: dir
        path: .
